[project]
name = "tuklas-agent"
version = "0.1.0"
description = "Local-first vectorless retrieval for private law documents"
authors = [{ name = "Doniele Arys Antonio", email = "arysantonio363@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "pymupdf==1.24.14",
    "rapidfuzz==3.10.1",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "python-multipart==0.0.19",
    "httpx==0.28.1",
    "rank-bm25 (==0.2.2)",
    "langgraph (>=0.2.0,<0.3.0) ; python_version >= \"3.11\" and python_version < \"3.13\"",
    "fastembed==0.9.0",
    "numpy==2.4.6",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-cov = "7.1.0"
mypy = "1.13.0"
ruff = "0.8.2"
diff-cover = "10.6.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E501 (line length) is enforced by formatter convention; long DDL/docstrings excluded
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["fitz", "rapidfuzz.*", "rank_bm25"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
addopts = "-q"
