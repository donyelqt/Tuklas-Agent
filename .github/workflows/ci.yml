name: ci

# The step order is the order PLAN.md Day 7 and CONSTRAINTS.md name, and the
# order is deliberate: the cheapest and most deterministic gates run first, so
# a broken import is caught before the suite spends minutes on it.
#
#   1. mypy on apps/api      (zero errors)
#   2. ruff on apps/api      (zero errors)
#   3. tsc + eslint on apps/web (zero errors)
#   4. gitleaks              (zero findings)
#   5. the two check scripts (exit 0)
#   6. pytest                (green)
#   7. diff-cover            (>= 80% on changed lines)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pinned tool versions. The Python ones come from poetry.lock (the
  # main group and the dev group), so the gate that runs here is the gate
  # the manifest describes. The rest are the tools the lock file does not
  # carry.
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.2.1"
  MYPY_VERSION: "1.13.0"
  RUFF_VERSION: "0.8.2"
  PYTEST_VERSION: "8.3.4"
  DIFF_COVER_VERSION: "10.6.0"
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # diff-cover compares the working tree against a base branch, and
          # gitleaks' `detect` mode walks the commit history. Both need the
          # history and the base ref, not a shallow clone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The pinned manifest IS the toolchain. `poetry install` installs
      # exactly what `poetry.lock` pins -- every runtime dependency AND the
      # dev group (mypy, ruff, pytest, pytest-cov, diff-cover) -- so the
      # gate that runs here is the gate the manifest describes. A hand-written
      # `pip install` list would drift from the lock file, and the lock file
      # is the thing the repo promises is pinned.
      #
      # The Poetry version is pinned here for the same reason the tool
      # versions are: an unpinned installer resolves differently over time.
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==${POETRY_VERSION}"

      - name: Cache the Poetry installs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs
            ~/.cache/pypoetry/artifacts
            ~/.cache/pypoetry/cache
          key: poetry-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      # Every Python command below runs through `poetry run`, because
      # Poetry's virtualenv lives in its own cache directory and is NOT the
      # interpreter `actions/setup-python` provides. `poetry run` puts the
      # pinned environment on the PATH for that one command.
      - name: Install the pinned toolchain from poetry.lock
        run: poetry install --no-root --no-interaction

      - name: Show the installed tool versions
        run: |
          poetry run python -m mypy --version
          poetry run python -m ruff --version
          poetry run python -m pytest --version
          poetry run diff-cover --version
          poetry --version

      # ------------------------------------------------------------------
      # 1. mypy on apps/api -- zero errors
      # ------------------------------------------------------------------
      - name: mypy (apps/api)
        run: poetry run python -m mypy apps/api

      # ------------------------------------------------------------------
      # 2. ruff on apps/api -- zero errors
      # ------------------------------------------------------------------
      - name: ruff (apps/api)
        run: poetry run python -m ruff check apps/api

      # ------------------------------------------------------------------
      # 3. tsc + eslint on apps/web -- zero errors
      # ------------------------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the web dependencies
        working-directory: apps/web
        run: npm ci

      - name: tsc (apps/web)
        working-directory: apps/web
        run: npx tsc --noEmit -p tsconfig.json

      - name: eslint (apps/web)
        working-directory: apps/web
        run: npm run lint

      # ------------------------------------------------------------------
      # 4. gitleaks -- zero findings
      # ------------------------------------------------------------------
      # The binary is downloaded from the pinned release and its checksum is
      # verified against the release's own checksums file, so a compromised
      # download cannot quietly become the scanner.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          # The archive is downloaded under the name the release's own
          # checksums file lists it under, because `sha256sum --check` looks
          # up the file by the NAME in the checksums line. Downloading it as
          # `gitleaks.tar.gz` and then checking the name
          # `gitleaks_<version>_linux_x64.tar.gz` makes sha256sum look for a
          # file that does not exist under the name it is checking, and the
          # step fails with "FAILED open or read" before the scan ever runs.
          # The archive's own name is the one that verifies.
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          # The download goes into its own directory, OUTSIDE the checkout.
          # `sha256sum --check` resolves the file by the name in the
          # checksums line, relative to the working directory, so the
          # archive and the checksums file have to be looked up from the
          # same place; and keeping both out of the checkout keeps the
          # NEXT step's scan (`gitleaks detect --source .`) over the
          # repository alone, with no downloaded tarball in its path.
          # The `trap` removes the directory again, on every exit path:
          # the step's working directory is the checkout, and a directory
          # left behind under /tmp is litter the runner keeps until the
          # job ends.
          work_dir="$(mktemp -d)"
          trap 'rm -rf "${work_dir}"' EXIT
          cd "$work_dir"
          # Both downloads ask curl to retry a TRANSIENT failure (5xx, 408,
          # 429, a reset connection, a timeout) four times, 5 seconds apart.
          # This is a retry and NOT the corpus step's degrade-and-warn
          # treatment, and the difference is the point: the scanner IS a gate
          # (CONSTRAINTS.md: "Secrets: No findings"), so there is nothing a
          # missing binary could degrade to. Warning here would either fail
          # in the NEXT step anyway, when `gitleaks detect` finds no binary,
          # or -- worse -- delete the scan, which is the one outcome a gate
          # must never have. A release that does not exist is also not the
          # same failure as a release that is slow: curl retries 5xx and
          # connection failures, and a 404 stays a 404 and fails on the first
          # attempt. The checksum check below stays hard either way.
          curl -sSfL --retry 4 --retry-delay 5 "$url" -o "$archive"
          curl -sSfL --retry 4 --retry-delay 5 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            -o checksums.txt
          # The checksums line is read into a variable, not piped straight
          # into `sha256sum --check`. Two reasons, both about the gate
          # actually being a gate:
          #
          # 1. `grep <pattern> file | sha256sum --check` reads the file
          #    list from STDIN, and if the grep matches NOTHING the check
          #    sees an empty list and reports "no properly formatted
          #    SHA256 checksum lines found" -- a failure, but one that says
          #    nothing about WHICH file was expected. Selecting the line
          #    first makes a missing entry fail loudly, by name.
          # 2. `sha256sum --check` verifies the file NAMED in the line, so
          #    the name in the line and the name on disk have to be the
          #    same. `cd`ing into the directory that holds the archive
          #    keeps that true regardless of what the runner's working
          #    directory is.
          #
          # The line is selected with `awk`, not `grep`, and the difference
          # is load-bearing under `set -e`. `grep` exits 1 when it matches
          # nothing, and a failing command substitution in an assignment
          # aborts the shell under `set -e` -- so with `grep` the "does not
          # list" branch below was DEAD CODE: the step died on the bare
          # grep exit status and never printed the message naming the
          # missing archive. `awk` exits 0 when it matches nothing, so the
          # branch is reached and the failure names the archive.
          # `awk` also matches the file name EXACTLY, on the second field:
          # the archive's own name, not a prefix of it, so a `.sig` or
          # `.zip` entry for a different asset can never be selected.
          expected_line="$(awk -v name="${archive}" '$2 == name { print }' checksums.txt)"
          if [ -z "${expected_line}" ]; then
            echo "gitleaks: the checksums file does not list ${archive}" >&2
            exit 1
          fi
          echo "expected: ${expected_line}"
          echo "${expected_line}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          # The version the binary REPORTS must be the version that was
          # pinned above. The checksum proves the bytes are the ones the
          # release published; this proves the release is the one this
          # workflow asked for, so a silently re-pointed download cannot
          # become the scanner.
          installed_version="$(gitleaks version)"
          echo "installed: gitleaks ${installed_version}"
          if [ "$installed_version" != "${GITLEAKS_VERSION}" ]; then
            echo "gitleaks: expected version ${GITLEAKS_VERSION}, got ${installed_version}" >&2
            exit 1
          fi

      - name: gitleaks
        run: gitleaks detect --redact --no-banner --source .

      # ------------------------------------------------------------------
      # 5. the two check scripts -- exit 0
      # ------------------------------------------------------------------
      # The corpus PDFs are gitignored (ADR-002), so a CI runner has none.
      # The script fetches them from the URLs `docs/CORPUS.md` records and
      # verifies the sha256 of each; a mismatch is a hard failure, because a
      # corpus that is not the recorded one invalidates every gold node id.
      #
      # The suite is written so that it needs NEITHER the corpus files NOR a
      # live model: the tests that want a corpus skip themselves with a clear
      # message when the file is absent. Fetching it here means those tests
      # RUN in CI instead of skipping.
      #
      # That makes this step an ENABLER, not a gate on the code under test,
      # and an enabler whose only failure mode is "a host in another country
      # did not answer" must not decide whether the build is green. So:
      #
      #   * the download RETRIES with growing backoff, inside the script:
      #     four retries at 5/15/45/90 seconds. A 522 is Cloudflare saying
      #     the ORIGIN timed out, which is a statement about the host and
      #     not about the artifact, and a single attempt turns that into a
      #     red build;
      #   * if the host is still unreachable the step WARNS and exits 0. The
      #     artifact is absent, the corpus-dependent tests SKIP themselves,
      #     and the pytest step below reports that count explicitly, so a
      #     green build cannot hide that those tests did not run;
      #   * a checksum MISMATCH is still FATAL: the script exits 1 there and
      #     this step fails on any status that is neither "verified" nor
      #     "host unreachable". Only a host that never answered degrades;
      #   * the primary (Civil Code) and the secondary (U.S. Code Title 11)
      #     are fetched INDEPENDENTLY: the primary matters far more, and
      #     neither artifact's outcome may prevent the other's attempt. The
      #     step therefore runs with `-e` OFF and exits with the worst
      #     outcome once BOTH have been attempted.
      - name: Fetch the benchmark corpus
        run: |
          # `-e` is off deliberately, and stated rather than left to the
          # runner's default (`bash -e {0}`): a step whose job is to
          # tolerate ONE class of failure cannot be written under a flag
          # that turns every failure into an exit. Every command below is
          # checked by the code that handles it, rather than by the shell.
          set +e
          set -u
          set -o pipefail

          # The script's three outcomes, as exit statuses. They are a
          # contract, so the numbers are named here instead of spelled
          # inline: 0 verified, 1 the bytes are not the recorded artifact,
          # 3 the host never answered.
          verified_status=0
          integrity_status=1
          unreachable_status=3

          hard_failure=0
          degraded=0

          fetch_one() {
            local label="$1"
            local log_file status reason outcome
            shift
            echo "fetch_corpus: requesting the ${label} corpus"
            log_file="$(mktemp)"
            # The script's output is streamed, so a reader watching the run
            # sees each attempt as it happens rather than a silent block
            # during the backoff, AND kept, so the warning below can quote
            # the script's own failure line -- which names the URL and the
            # HTTP error -- inside the annotation.
            poetry run python -m scripts.fetch_corpus "$@" 2>&1 | tee "${log_file}"
            # `tee` succeeds whoever wins the pipe, so the status is read
            # from PIPESTATUS immediately after the pipeline.
            status="${PIPESTATUS[0]}"

            outcome="${verified_status}"
            if [ "${status}" -eq "${verified_status}" ]; then
              echo "fetch_corpus: the ${label} corpus is present and its sha256 matches"
            elif [ "${status}" -eq "${unreachable_status}" ]; then
              # The one soft outcome. `awk`, not `grep`, for the same reason
              # the gitleaks step uses it: `grep` exits 1 when it matches
              # nothing, and under `-e` that would abort the shell -- here it
              # would abort the very branch that reports the degradation.
              reason="$(awk '/^fetch_corpus: UNREACHABLE/ { last = $0 } END { print last }' "${log_file}")"
              if [ -z "${reason}" ]; then
                reason="fetch_corpus: UNREACHABLE: the ${label} corpus could not be fetched"
              fi
              echo "::warning title=Degraded run: the ${label} corpus could not be fetched::${reason}"
              echo "WARNING: the ${label} corpus is ABSENT in this run, so every test that needs it SKIPS instead of running."
              echo "WARNING: nothing about this repository is broken -- the host did not answer. Re-run once the host is back to run those tests."
              degraded=1
            else
              # Every other status is the hard case: the host ANSWERED, and
              # what came back is not the artifact docs/CORPUS.md records.
              # That is not somebody else's uptime, so it is not tolerated.
              echo "::error title=The ${label} corpus is not the recorded artifact::the fetch script exited ${status}; only ${verified_status} (verified) and ${unreachable_status} (host unreachable) are tolerated. A corpus that is not the one docs/CORPUS.md records invalidates every gold node id."
              outcome="${status}"
            fi

            rm -f "${log_file}"
            return "${outcome}"
          }

          # Both artifacts are attempted whatever the other one did, and the
          # primary is first because it is the artifact the retrieval tests
          # need. A failing `fetch_one` records the failure; it does not stop
          # the step.
          if ! fetch_one primary --corpus primary; then
            hard_failure=1
          fi
          if ! fetch_one secondary --corpus secondary; then
            hard_failure=1
          fi

          if [ "${hard_failure}" -ne 0 ]; then
            echo "fetch_corpus: FAILED: an artifact that arrived is not the one docs/CORPUS.md records (see the errors above)." >&2
            exit "${integrity_status}"
          fi

          # The summary says which of the two tolerated outcomes this was: a
          # step that printed "everything is present" after a warning would be
          # the log lying about the run.
          if [ "${degraded}" -ne 0 ]; then
            echo "fetch_corpus: DEGRADED: at least one corpus was not fetched, so the tests that need it SKIP (see the warnings above). The gates on this repository's code ran in full."
            exit "${verified_status}"
          fi

          echo "fetch_corpus: every requested artifact is present and its sha256 matches"

      - name: Vectorless quarantine scan
        run: poetry run python scripts/check_no_vectors.py

      - name: Eval run-config parity check
        run: poetry run python scripts/check_eval_config.py scripts/fixtures/example-run-config.json

      # The two proof scripts are the CI-visible evidence that the check
      # scripts FAIL on a deliberate violation, not only that they pass on a
      # clean tree. They write temporary files and remove them again.
      - name: Prove the quarantine scan fails on a violation
        run: poetry run python scripts/prove_check_no_vectors.py

      - name: Prove the config check fails on a violation
        run: poetry run python scripts/prove_check_eval_config.py

      # The reproducibility rule (evaluation.md §6): "Same config -> same
      # retrieval metrics exactly". The script runs the retrieval pass twice
      # over two FRESH ingests, so a pass that reproduced itself through a
      # cached artifact would fail.
      - name: Retrieval reproducibility (same config id -> same metrics)
        run: poetry run python -m scripts.check_reproducibility

      # ------------------------------------------------------------------
      # 6. pytest -- green
      # ------------------------------------------------------------------
      # A skipped test is invisible in a green build, and the corpus-dependent
      # tests are exactly the ones that skip when the fetch step above
      # degraded. So the skips are COUNTED and reported after the suite, and a
      # corpus-dependent skip is named explicitly: a reader of a green build
      # can then see that the corpus tests did NOT run, instead of reading the
      # green as "everything passed".
      #
      # The step still exits with pytest's own status, so the gate itself is
      # unchanged: this adds a report, not a tolerance.
      - name: pytest (apps/api)
        run: |
          # `-e` is off so the report below is still printed when the suite
          # is RED. The step exits with pytest's status either way.
          set +e
          set -u
          set -o pipefail
          report="$(mktemp)"
          trap 'rm -f "${report}"' EXIT
          # `-rs` is what makes the skip REASONS visible; without it a skipped
          # test is only a number in the summary line, and "which skip needed
          # the corpus" is not observable at all.
          poetry run python -m pytest apps/api/tests -q -rs | tee "${report}"
          # `tee` succeeds whoever wins the pipe, so the status is read from
          # PIPESTATUS immediately after the pipeline.
          status="${PIPESTATUS[0]}"

          # The total is read from pytest's own summary line ("232 passed,
          # 86 skipped in 55.00s"), the corpus-dependent ones from the
          # `SKIPPED [n] <path>: <reason>` lines. Every corpus-dependent skip
          # in this suite says so in its reason -- "corpus file missing:
          # ..." or "a corpus PDF is missing" -- which is what makes the
          # distinction observable rather than guessed. The `[n]` is the
          # number of tests that skip for that one reason, so the corpus
          # count is the sum of those, not the number of lines.
          skipped="$(awk 'match($0, /[0-9]+ skipped/) { count = substr($0, RSTART, RLENGTH) } END { sub(/ skipped/, "", count); print (count == "" ? 0 : count) }' "${report}")"
          corpus_skipped="$(awk 'tolower($0) ~ /^skipped/ && tolower($0) ~ /corpus/ { count = $2; gsub(/[^0-9]/, "", count); total += count } END { print total + 0 }' "${report}")"

          echo "pytest: ${skipped} test(s) skipped in this run, ${corpus_skipped} of them because the corpus is absent."
          if [ "${corpus_skipped}" -gt 0 ]; then
            echo "::warning title=The corpus-dependent tests did not run::${corpus_skipped} test(s) skipped themselves because the corpus artifact is absent, so this build did NOT exercise them. The fetch step above says why the artifact is missing."
          else
            echo "pytest: no skipped test needed the corpus, so this run exercised every corpus-dependent test."
          fi

          exit "${status}"

      # ------------------------------------------------------------------
      # 7. diff-cover -- >= 80% on changed lines
      # ------------------------------------------------------------------
      # `--compare-branch=main` is the rule CONSTRAINTS.md names. The base
      # ref is the REMOTE-tracking branch, because the checkout action leaves
      # no local `main` branch behind, and it is resolved from the event so a
      # pull request is compared against the branch it targets and a push
      # against main.
      - name: Coverage on changed lines
        run: |
          set -euo pipefail
          base_ref="origin/main"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
          fi
          poetry run python -m pytest apps/api/tests -q --cov=apps/api --cov-report=xml:coverage.xml
          poetry run diff-cover coverage.xml --compare-branch="$base_ref" --fail-under=80

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
